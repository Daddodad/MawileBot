[SableyeBot]
bot_token = <bot token>                             # As pure values (no " ... "), ex: 123456789:aabbcc_aabb112233
admin_whitelist = [ <chatid>, <chat id> ...]        # Access to admin commands,    ex: [123456789,234567891]

[MawileBot]
bot_token = <bot token>                             # As pure values (no " ... "), ex: 123456789:aabbcc_aabb112233
admin_whitelist = [ <chatid>, <chat id> ...]        # Access to admin commands,    ex: [123456789,234567891]   

[BeatlesBoy]
api_id = <api_id>                                   # As number,                   ex: 123456789
api_hash = <api_hash>                               # As pure values (no " ... "), ex: 1a2b3c4d5e6f7g
allowed_chat_ids =  [ <chatid>, <chat id> ...]      # So that BeatlesBoy does not answer in any chat but only designated groups/chats, ex: [123456789,234567891]  

